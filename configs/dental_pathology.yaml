  1: Caries
  2: Crown
  3: Filling
  4: Implant
  5: Malaligned
  6: Missing teeth
  7: Periapical lesion
  8: Retained root
  9: Root Canal Treatment
  10: Root Piece
  11: impacted tooth
  12: Bone Loss
  13: Supra Eruption
  14: abutment
  15: metal band
  16: orthodontic brackets
  17: post - core
  18: wire
